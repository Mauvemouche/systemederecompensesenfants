<!DOCTYPE html>
<html lang="fr" data-i18n-title="header.title">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Système de récompenses</title>

  <!-- IMPORTANT: garde ton styles.css existant -->
  <link rel="stylesheet" href="./styles.css?v=112" />
</head>

<body>
  <div class="container">

    <!-- ===== HEADER ===== -->
    <header class="main-header">
      <div class="header-row">
        <div>
          <h1 data-i18n="header.title"></h1>
          <p id="familySubtitle" data-i18n="header.subtitle"></p>
        </div>

        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <div id="accountBar" class="account-bar hidden">
            <span id="accountEmail"></span>
            <span id="accountBilling"></span>
            <button id="portalBtn" class="btn-refresh" type="button" data-i18n="header.portal"></button>
            <button id="changeAdminPinBtn" class="btn-refresh change-admin-pin-btn" type="button" data-i18n="header.changePin"></button>
            <button id="logoutBtn" class="btn-refresh" type="button" data-i18n="header.logout"></button>
          </div>
          <button id="adminModeBtn" class="admin-mode-btn" data-i18n-title="header.adminMode" title="" type="button">🔒</button>
          <button class="btn-refresh" id="refreshBtn" type="button" data-i18n="header.refresh"></button>
        </div>
      </div>
    </header>

    <!-- ===== NAVIGATION DES JOURS ===== -->
    <section class="day-navigation">
      <div class="day-nav-main">
        <button class="day-nav-btn" type="button" onclick="previousDay()">⬅ <span id="prevDayName"></span></button>
        <h2 id="dayNavigationTitle" class="day-nav-title">📅</h2>
        <button class="day-nav-btn" type="button" onclick="nextDay()"><span id="nextDayName"></span> ➡</button>
      </div>

      <div class="day-nav-quick">
        <button id="dayBtn1" class="day-quick-btn" type="button" onclick="changeDay(1)" data-i18n="day.short.1"></button>
        <button id="dayBtn2" class="day-quick-btn" type="button" onclick="changeDay(2)" data-i18n="day.short.2"></button>
        <button id="dayBtn3" class="day-quick-btn" type="button" onclick="changeDay(3)" data-i18n="day.short.3"></button>
        <button id="dayBtn4" class="day-quick-btn" type="button" onclick="changeDay(4)" data-i18n="day.short.4"></button>
        <button id="dayBtn5" class="day-quick-btn" type="button" onclick="changeDay(5)" data-i18n="day.short.5"></button>
        <button id="dayBtn6" class="day-quick-btn" type="button" onclick="changeDay(6)" data-i18n="day.short.6"></button>
        <button id="dayBtn0" class="day-quick-btn" type="button" onclick="changeDay(0)" data-i18n="day.short.0"></button>
      </div>
    </section>

    <!-- ===== WARNING BANNER ===== -->
    <div id="dayWarningBanner" class="day-warning-banner hidden">
      <div class="warning-content">
        <div class="warning-icon">⚠️</div>
        <div class="warning-text">
          <strong><span data-i18n="day.lookingAt"></span> <span id="warningDayName"></span></strong><br />
          <small><span data-i18n="day.todayPrefix"></span> <span id="warningTodayName">—</span></small>
        </div>
        <button class="btn-today" type="button" onclick="goToToday()" data-i18n="day.backToday"></button>
      </div>
    </div>

    <!-- ===== FILTERS ===== -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all" type="button" data-i18n="filter.all"></button>
    </div>

    <!-- ===== ADD TASK ===== -->
    <section class="add-task-section">
      <div class="header-row add-task-toggle" id="toggleFormBtn" role="button" tabindex="0" aria-expanded="false">
  <h2 style="margin:0; color:#222;" data-i18n="task.addSection"></h2>
  </div>


      <form id="taskForm" class="task-form hidden">
        <h3 data-i18n="task.new"></h3>

        <div class="form-group">
          <label for="taskTitle" data-i18n="task.title"></label>
          <input id="taskTitle" type="text" data-i18n-placeholder="task.titlePlaceholder" placeholder="" required />
          <small class="hint" data-i18n="task.bonusHint"></small>
        </div>

        <div class="form-group">
          <label for="taskDescription" data-i18n="task.description"></label>
          <textarea id="taskDescription" rows="2" data-i18n-placeholder="task.descPlaceholder" placeholder=""></textarea>
        </div>

        <div class="form-group">
          <label for="assignedTo" data-i18n="task.person"></label>
          <select id="assignedTo" required>
            <option value="" data-i18n="task.choose"></option>
            <option value="papa">Papa</option>
            <option value="maman">Maman</option>
            <option value="kid-1">Kid 1</option>
            <option value="kid-2">Kid 2</option>
          </select>
        </div>

        <div class="form-group">
          <label for="stars" data-i18n="task.stars"></label>
          <select id="stars">
            <option value="1">1 ⭐</option>
            <option value="2">2 ⭐</option>
            <option value="3" selected>3 ⭐</option>
            <option value="4">4 ⭐</option>
            <option value="5">5 ⭐</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category" data-i18n="task.category"></label>
          <select id="category">
            <option value="quotidien" selected data-i18n="task.cat.quotidien"></option>
            <option value="hebdomadaire" data-i18n="task.cat.hebdomadaire"></option>
            <option value="mensuel" data-i18n="task.cat.mensuel"></option>
            <option value="ponctuel" data-i18n="task.cat.ponctuel"></option>
          </select>
          <small class="hint" data-i18n="task.catHint"></small>
        </div>

        <div id="specificDateGroup" class="form-group" style="display:none;">
          <label id="dateLabel" for="specificDate" data-i18n="task.date"></label>
          <input id="specificDate" type="date" />
        </div>

        <div id="daysSelectionGroup" class="form-group">
          <label data-i18n="task.daysDaily"></label>
          <div class="days-checkboxes">
            <label class="day-checkbox-label">
              <input id="allDays" class="day-checkbox" type="checkbox" checked />
              <span data-i18n="task.allDays"></span>
            </label>
            <label class="day-checkbox-label"><input id="day1" class="day-checkbox" type="checkbox" checked /><span data-i18n="day.short.1"></span></label>
            <label class="day-checkbox-label"><input id="day2" class="day-checkbox" type="checkbox" checked /><span data-i18n="day.short.2"></span></label>
            <label class="day-checkbox-label"><input id="day3" class="day-checkbox" type="checkbox" checked /><span data-i18n="day.short.3"></span></label>
            <label class="day-checkbox-label"><input id="day4" class="day-checkbox" type="checkbox" checked /><span data-i18n="day.short.4"></span></label>
            <label class="day-checkbox-label"><input id="day5" class="day-checkbox" type="checkbox" checked /><span data-i18n="day.short.5"></span></label>
            <label class="day-checkbox-label"><input id="day6" class="day-checkbox" type="checkbox" checked /><span data-i18n="day.short.6"></span></label>
            <label class="day-checkbox-label"><input id="day0" class="day-checkbox" type="checkbox" checked /><span data-i18n="day.short.0"></span></label>
          </div>
        </div>

        <div class="form-group" style="display:flex; gap:14px; flex-wrap:wrap;">
          <label class="modal-check" style="flex:1;">
            <input id="isBonus" type="checkbox" />
            <span>🎁 <span data-i18n="task.bonus"></span></span>
          </label>
          <label class="modal-check" style="flex:1;">
            <input id="isPenalty" type="checkbox" />
            <span>⛔ <span data-i18n="task.penalty"></span></span>
          </label>
          <label class="modal-check" style="flex:1;">
            <input id="isSeriousFault" type="checkbox" />
            <span>💀 <span data-i18n="task.serious"></span></span>
          </label>
        </div>

        <div class="form-actions">
          <button id="cancelFormBtn" class="btn-secondary" type="button" data-i18n="task.cancel"></button>
          <button class="btn-primary" type="submit" data-i18n="task.add"></button>
        </div>
      </form>
    </section>

    <!-- ===== PERSONS GRID ===== -->
    <section class="persons-container"></section>

    <!-- ===== DEBUG PANEL ===== -->
    <div id="debugPanel" class="debug-panel" style="display:none;">
      <div class="debug-header">
        <strong>DEBUG</strong>
        <button class="btn-debug-clear" type="button" onclick="clearDebugLogs()">Clear</button>
      </div>
      <div id="debugLogs" class="debug-logs"></div>
    </div>

  </div><!-- /.container -->

  <!-- ===== Admin PIN Modal ===== -->
<div id="adminPinOverlay" class="modal-overlay hidden" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="adminPinTitle">
    <div class="modal-header">
      <h3 id="adminPinTitle">🔒 <span data-i18n="admin.pinTitle"></span></h3>
      <button id="adminPinCloseBtn" class="modal-close" type="button" data-i18n-aria="task.close">✕</button>
    </div>

    <form id="adminPinForm" class="modal-body">
      <label class="modal-label" data-i18n="admin.pinLabel"></label>
      <input
        id="adminPinInput"
        class="modal-input"
        type="password"
        inputmode="numeric"
        autocomplete="one-time-code"
        placeholder="••••"
        required
      />

      <div id="adminPinError" class="modal-hint" style="color:#d32f2f; display:none;" data-i18n="admin.pinWrong"></div>
      <p class="modal-hint" style="margin-top:10px;">
        <a href="#" id="recoverAdminPinLink" data-i18n="admin.recover"></a>
      </p>
      <p id="recoverAdminPinHint" class="modal-hint" style="display:none; color:#2e7d32;"></p>

      <div class="modal-footer">
        <button type="button" id="adminPinCancelBtn" class="btn btn-secondary" data-i18n="admin.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="admin.validate"></button>
      </div>
    </form>
  </div>
</div>

  <!-- ===== Change Admin PIN ===== -->
<div id="changeAdminPinOverlay" class="modal-overlay hidden" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="changeAdminPinTitle">
    <div class="modal-header">
      <h3 id="changeAdminPinTitle" data-i18n="admin.changeTitle"></h3>
      <button id="changeAdminPinCloseBtn" class="modal-close" type="button" data-i18n-aria="task.close">✕</button>
    </div>
    <form id="changeAdminPinForm" class="modal-body">
      <div id="changeAdminPinCurrentWrap">
        <label class="modal-label" for="changeAdminPinCurrent" data-i18n="admin.currentPin"></label>
        <input id="changeAdminPinCurrent" class="modal-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" />
      </div>
      <label class="modal-label" for="changeAdminPinNew" data-i18n="admin.newPin"></label>
      <input id="changeAdminPinNew" class="modal-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" required />
      <label class="modal-label" for="changeAdminPinNew2" data-i18n="admin.confirmPin"></label>
      <input id="changeAdminPinNew2" class="modal-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" required />
      <div id="changeAdminPinError" class="modal-hint" style="color:#d32f2f; display:none;"></div>
      <div class="modal-footer">
        <button type="button" id="changeAdminPinCancelBtn" class="btn btn-secondary" data-i18n="admin.cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="task.save"></button>
      </div>
    </form>
  </div>
</div>
  <div id="editModalOverlay" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal-header">
        <h3 id="editModalTitle" data-i18n="task.edit"></h3>
        <button id="editModalCloseBtn" class="modal-close" type="button" data-i18n-aria="task.close">✕</button>
      </div>

      <form id="editTaskForm" class="modal-body">
        <input type="hidden" id="editTaskId" />

        <label class="modal-label" data-i18n="task.title"></label>
        <input id="editTitle" class="modal-input" type="text" required />

        <label class="modal-label" data-i18n="task.description"></label>
        <textarea id="editDescription" class="modal-textarea" rows="3"></textarea>

        <div class="modal-row">
          <div class="modal-col">
            <label class="modal-label" data-i18n="task.stars"></label>
            <select id="editStars" class="modal-input">
              <option value="1">1 ⭐</option>
              <option value="2">2 ⭐</option>
              <option value="3">3 ⭐</option>
              <option value="4">4 ⭐</option>
              <option value="5">5 ⭐</option>
            </select>
          </div>

          <div class="modal-col">
            <label class="modal-label" data-i18n="task.category"></label>
            <select id="editCategory" class="modal-input">
              <option value="quotidien" data-i18n="task.cat.quotidien"></option>
              <option value="hebdomadaire" data-i18n="task.cat.hebdomadaire"></option>
              <option value="mensuel" data-i18n="task.cat.mensuel"></option>
              <option value="ponctuel" data-i18n="task.cat.ponctuel"></option>
            </select>
          </div>
        </div>

        <div class="modal-row">
          <label class="modal-check">
            <input id="editIsBonus" type="checkbox" />
            <span>🎁 <span data-i18n="task.bonus"></span></span>
          </label>

          <label class="modal-check">
            <input id="editIsPenalty" type="checkbox" />
            <span>⛔ <span data-i18n="task.penalty"></span></span>
          </label>

          <label class="modal-check">
            <input id="editIsSeriousFault" type="checkbox" />
            <span>💀 <span data-i18n="task.serious"></span></span>
          </label>
        </div>

        <div id="editDateBlock" class="modal-row hidden">
          <div class="modal-col" style="flex:1;">
            <label id="editDateLabel" class="modal-label" data-i18n="task.date"></label>
            <input id="editSpecificDate" class="modal-input" type="date" />
            <div class="modal-hint" data-i18n="task.editDateHint"></div>
          </div>
        </div>

        <div class="modal-footer">
          <button id="editCancelBtn" class="btn btn-secondary" type="button" data-i18n="task.cancel"></button>
          <button class="btn btn-primary" type="submit" data-i18n="task.save"></button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Replica gate (auth / Stripe / kids) ===== -->
  <div id="authGate" class="auth-gate" aria-hidden="false">
    <div class="auth-card">
      <section id="gate-auth">
        <h2 id="authTitle" data-i18n="gate.loginTitle"></h2>
        <p class="gate-lead" data-i18n="gate.lead"></p>
        <form id="authForm" data-mode="login">
          <label class="modal-label" for="authEmail" data-i18n="gate.email"></label>
          <input id="authEmail" class="modal-input" type="email" autocomplete="email" required />
          <label class="modal-label" for="authPassword" data-i18n="gate.password"></label>
          <input id="authPassword" class="modal-input" type="password" autocomplete="current-password" required minlength="6" />
          <p id="gateError" class="gate-error" role="alert" style="display:none;"></p>
          <div class="modal-footer" style="margin-top:14px;">
            <button id="authSubmit" class="btn btn-primary" type="submit" data-i18n="gate.login"></button>
          </div>
        </form>
        <p><a href="#" id="toggleAuthMode" data-i18n="gate.toggleSignup"></a></p>
      </section>

      <section id="gate-verify" class="hidden">
        <h2 data-i18n="gate.verifyTitle"></h2>
        <p class="gate-lead">
          <span data-i18n="gate.verifyLeadBefore"></span>
          <span id="verifyEmailHint"></span>.
          <span data-i18n="gate.verifyLeadAfter"></span>
        </p>
        <form id="verifyForm">
          <label class="modal-label" for="verifyCode" data-i18n="gate.verifyCode"></label>
          <input id="verifyCode" class="modal-input" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required />
          <p class="gate-error" role="alert" style="display:none;"></p>
          <p id="verifyResent" class="modal-hint" style="display:none; color:#2e7d32;"></p>
          <div class="modal-footer" style="margin-top:14px;">
            <button id="verifySubmit" class="btn btn-primary" type="submit" data-i18n="gate.verifySubmit"></button>
          </div>
        </form>
        <p><a href="#" id="resendCodeBtn" data-i18n="gate.resend"></a> · <a href="#" id="backToAuthBtn" data-i18n="gate.back"></a></p>
      </section>

      <section id="gate-checkout" class="hidden">
        <h2 data-i18n="gate.checkoutTitle"></h2>
        <p class="gate-lead" data-i18n="gate.checkoutLead"></p>
        <p class="gate-error" role="alert" style="display:none;"></p>
        <div class="plan-row">
          <button id="checkoutMonthlyBtn" class="plan-card" type="button">
            <strong data-i18n="gate.monthly"></strong>
            <span data-i18n="gate.priceMonth"></span>
            <small data-i18n="gate.afterTrial"></small>
          </button>
          <button id="checkoutYearlyBtn" class="plan-card" type="button">
            <strong data-i18n="gate.yearly"></strong>
            <span data-i18n="gate.priceYear"></span>
            <small data-i18n="gate.afterTrial"></small>
          </button>
        </div>
      </section>

      <section id="gate-gift" class="hidden">
        <h2 data-i18n="gate.giftTitle"></h2>
        <p class="gate-lead" data-i18n-html="gate.giftLead"></p>
        <p class="gate-error" role="alert" style="display:none;"></p>
        <div class="modal-footer" style="margin-top:14px;">
          <button id="giftContinueBtn" class="btn btn-primary" type="button" data-i18n="gate.continue"></button>
        </div>
      </section>

      <section id="gate-pin" class="hidden">
        <h2 data-i18n="gate.pinTitle"></h2>
        <p class="gate-lead" data-i18n="gate.pinLead"></p>
        <form id="setupPinForm">
          <label class="modal-label" for="setupPin" data-i18n="gate.pinCode"></label>
          <input id="setupPin" class="modal-input" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="new-password" required />
          <label class="modal-label" for="setupPinConfirm" data-i18n="gate.pinConfirm"></label>
          <input id="setupPinConfirm" class="modal-input" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="new-password" required />
          <p class="gate-error" role="alert" style="display:none;"></p>
          <div class="modal-footer" style="margin-top:14px;">
            <button id="setupPinSubmit" class="btn btn-primary" type="submit" data-i18n="gate.save"></button>
          </div>
        </form>
      </section>

      <section id="gate-kids" class="hidden">
        <h2 data-i18n="gate.kidsTitle"></h2>
        <p class="gate-lead" data-i18n="gate.kidsLead"></p>
        <form id="kidsForm">
          <input id="childName1" class="modal-input" type="text" data-i18n-placeholder="gate.child1" placeholder="" required />
          <input id="childName2" class="modal-input" type="text" data-i18n-placeholder="gate.child2" placeholder="" />
          <input id="childName3" class="modal-input" type="text" data-i18n-placeholder="gate.child3" placeholder="" />
          <input id="childName4" class="modal-input" type="text" data-i18n-placeholder="gate.child4" placeholder="" />
          <p class="gate-error" role="alert" style="display:none;"></p>
          <div class="modal-footer" style="margin-top:14px;">
            <button class="btn btn-primary" type="submit" data-i18n="gate.save"></button>
          </div>
        </form>
      </section>

      <section id="gate-blocked" class="hidden">
        <h2 data-i18n="gate.blockedTitle"></h2>
        <p id="blockedText" class="gate-lead" data-i18n="gate.blockedLead"></p>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFunctions } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";
    import { firebaseConfig, FUNCTIONS_REGION } from "./js/firebase-config.js";
    import { bootI18n } from "./js/i18n.js";
    import { startReplicaGate } from "./js/family-gate.js";

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.auth = getAuth(app);
    window.functions = getFunctions(app, FUNCTIONS_REGION);
    await bootI18n();
    startReplicaGate();
  </script>

  <script type="module" src="./js/app.js?v=112"></script>
</body>
</html>
